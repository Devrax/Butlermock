name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          # Pinned so formatter and linter updates cannot break the build
          # unannounced; bump deliberately.
          deno-version: "2.9.7"

      - name: Install dependencies
        run: deno install

      - name: Check (format, lint, type check, tests)
        run: deno task check

      - name: Build
        run: deno task build
